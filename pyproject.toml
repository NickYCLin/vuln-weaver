[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-weaver"
version = "0.1.0"
description = "A versatile vulnerability scan report aggregation, diffing, and Word report generation engine."
readme = "README.md"
authors = [{ name = "Nick Lin" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "docxtpl>=0.16.8",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pydantic>=2.6.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "matplotlib>=3.8.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "flake8>=7.0.0",
    "black>=24.0.0",
]

[project.scripts]
vuln-weaver = "vuln_weaver.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vuln_weaver*"]
