name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8
      - name: 語法與未定義名稱檢查
        run: flake8 vuln_weaver tests scripts --select E9,F63,F7,F82
      - name: 內建範本產生腳本要能執行
        run: python scripts/build_default_template.py
      - name: 單元測試
        run: pytest -q

  package:
    name: pip 安裝與 vuln-weaver 指令
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝套件（非可編輯模式，確認範本有被打包進去）
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: 指令可用且內建範本存在
        working-directory: ${{ runner.temp }}
        run: |
          vuln-weaver --version
          python -c "from vuln_weaver.reporters.template_reporter import DEFAULT_REPORT_TEMPLATE, DEFAULT_DIFF_TEMPLATE; assert DEFAULT_REPORT_TEMPLATE.exists() and DEFAULT_DIFF_TEMPLATE.exists()"
      - name: 冒煙測試：四種格式各出一份報告
        working-directory: ${{ runner.temp }}
        env:
          FIX: ${{ github.workspace }}/tests/fixtures
        run: |
          vuln-weaver parse "$FIX/sample.nessus" "$FIX/sample_nmap.xml" -n "CI 冒煙測試" -o merged.docx --org "CI" --tester "bot"
          vuln-weaver parse "$FIX/sample_zap.xml" -f xlsx -o zap.xlsx
          vuln-weaver parse "$FIX/sample_burp.xml" -f json -o burp.json
          vuln-weaver parse "$FIX/sample.nessus" -t "$(python -c 'from vuln_weaver.reporters.template_reporter import DEFAULT_REPORT_TEMPLATE as p; print(p)')" -o tpl.docx
          vuln-weaver diff "$FIX/sample.nessus" "$FIX/sample.nessus" -f xlsx -o diff.xlsx
          ls -la merged.docx zap.xlsx burp.json tpl.docx diff.xlsx
